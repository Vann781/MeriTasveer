# Render blueprint: an API service and a static frontend.
#
# The static site rewrites /api/* to the backend, so the browser only ever
# talks to one origin. That matters: meritasveer.onrender.com and
# meritasveer-api.onrender.com are separate sites, and a SameSite=Lax login
# cookie would not be sent between them. Proxying keeps it first-party and
# keeps sign-in working in Safari, which blocks third-party cookies outright.
#
# Secrets are marked sync:false — Render prompts for them instead of storing
# them here. Never commit real values.
#
# Memory: the default models need roughly 700 MB while indexing. "standard"
# (2 GB) is the smallest plan that fits; "starter" (512 MB) will be killed.
# See the Deploying section of the README.

services:
  - type: web
    name: meritasveer-api
    runtime: node
    plan: standard
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run models:download
    startCommand: node src/server.js
    healthCheckPath: /api/health

    # Keeps the database and the downloaded models across deploys.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 2

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: DATABASE_URL
        value: /var/data/photo_finder.db
      - key: MODELS_DIR
        value: /var/data/models

      # Requests arrive through the static site's proxy, so the browser sees
      # one origin and the cookie stays first-party.
      - key: COOKIE_SAMESITE
        value: lax

      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false

      - key: SESSION_SECRET
        generateValue: true
      - key: FACE_MATCH_THRESHOLD
        value: "0.40"
      - key: SEARCH_SESSION_TTL_MINUTES
        value: "120"

  - type: web
    name: meritasveer
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist

    envVars:
      # Empty means "same origin" — calls go to /api on this host and are
      # proxied to the backend by the rewrite below.
      - key: VITE_API_URL
        value: ""

    routes:
      # Order matters: the API rule has to come before the catch-all.
      - type: rewrite
        source: /api/*
        destination: https://meritasveer-api.onrender.com/api/*
      # Client-side routes such as /events/3 are served by the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
